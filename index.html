<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="icon" href="/favicon.ico" />
    <title>%VITE_APP_TITLE%</title>
    <!--[if lt IE 11
      ]><script>
        window.location.href = '/html/ie.html';
      </script><!
    [endif]-->
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0px;
        padding: 0px;
      }

      .chromeframe {
        margin: 0.2em 0;
        background: #ccc;
        color: #000;
        padding: 0.2em 0;
      }

      #loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(ellipse 70% 50% at 20% 30%, rgba(56, 189, 248, 0.16), transparent 55%),
          radial-gradient(ellipse 60% 40% at 82% 20%, rgba(34, 211, 238, 0.1), transparent 50%),
          linear-gradient(165deg, #152a4c 0%, #0e1a30 48%, #0a1424 100%);
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #loader-wrapper.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      .loader-mark {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: linear-gradient(180deg, #fff, #e8eeff);
        color: #1e3a8a;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25), 0 0 18px rgba(125, 211, 252, 0.35);
        opacity: 0;
        transform: translateY(8px);
        animation: titleIn 0.7s ease forwards;
      }
      .loader-mark svg {
        width: 26px;
        height: 26px;
        fill: currentColor;
      }

      .loader-title {
        font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #f3f6fb;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.12em;
        margin-bottom: 18px;
        text-shadow: 0 0 22px rgba(34, 211, 238, 0.35);
        opacity: 0;
        transform: translateY(8px);
        animation: titleIn 0.8s 0.15s ease forwards;
      }

      @keyframes titleIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .loader-status {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 24px;
        margin-bottom: 28px;
      }

      .loader-status-icon {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(34, 211, 238, 0.25);
        border-top-color: #22d3ee;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      .loader-status-icon.done {
        border: none;
        background: #22d3ee;
        animation: none;
        position: relative;
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.6);
      }
      .loader-status-icon.done::before,
      .loader-status-icon.done::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 2px;
        width: 3px;
        height: 7px;
        background: #fff;
        border-radius: 1px;
      }
      .loader-status-icon.done::before {
        transform: rotate(45deg);
      }
      .loader-status-icon.done::after {
        top: 6px;
        left: 5px;
        height: 4px;
        transform: rotate(-45deg);
      }

      .loader-status-text {
        font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #9aacc6;
        font-size: 14px;
        letter-spacing: 1px;
        transition: opacity 0.3s ease;
      }
      .loader-status-text.switching {
        opacity: 0;
      }

      .loader-progress {
        width: 280px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 0 12px rgba(34, 211, 238, 0.12);
      }

      .loader-progress-bar {
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent, #22d3ee, #3b82f6, transparent);
        border-radius: 99px;
        animation: progress 1.8s ease-in-out infinite;
      }

      #loader-wrapper.fade-out .loader-progress-bar {
        width: 100%;
        background: linear-gradient(90deg, #22d3ee, #3b82f6);
        animation: none;
        transition: width 0.6s ease;
      }

      @keyframes progress {
        0% {
          transform: translateX(-150%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .loader-dot {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #fef08a;
        box-shadow: 0 0 8px #facc15;
        animation: loaderFly 3s ease-in-out infinite;
        pointer-events: none;
      }
      .loader-dot:nth-child(1) {
        left: 18%;
        top: 28%;
      }
      .loader-dot:nth-child(2) {
        left: 76%;
        top: 22%;
        animation-delay: 0.8s;
      }
      .loader-dot:nth-child(3) {
        left: 22%;
        top: 72%;
        animation-delay: 1.4s;
        background: #bbf7d0;
        box-shadow: 0 0 8px #86efac;
      }
      .loader-dot:nth-child(4) {
        left: 82%;
        top: 68%;
        animation-delay: 0.4s;
      }
      @keyframes loaderFly {
        0%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-10px);
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <!-- 加载遮罩：放在 #app 外部，Vue mount 不会移除它 -->
    <div id="loader-wrapper">
      <span class="loader-dot"></span>
      <span class="loader-dot"></span>
      <span class="loader-dot"></span>
      <span class="loader-dot"></span>
      <div class="loader-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm7 9a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H8a1 1 0 0 0 0 2h8a1 1 0 0 0 0-2h-3v-3.08A7 7 0 0 0 19 10z" />
        </svg>
      </div>
      <div class="loader-title">%VITE_APP_TITLE%</div>
      <div class="loader-status">
        <div id="loader-status-icon" class="loader-status-icon"></div>
        <span id="loader-status-text" class="loader-status-text">正在加载应用资源…</span>
      </div>
      <div class="loader-progress">
        <div class="loader-progress-bar"></div>
      </div>
    </div>

    <!-- 分阶段状态管理：可在 Vue 应用启动各阶段调用 window.__setLoaderStatus(text) 更新文案 -->
    <script>
      (function () {
        let loaded = false;
        const stages = [];
        let currentStage = -1;
        const textEl = document.getElementById('loader-status-text');
        const iconEl = document.getElementById('loader-status-icon');

        /** 更新加载状态文案 */
        window.__setLoaderStatus = function (text, done) {
          if (!textEl || !iconEl || loaded) return;
          if (text) {
            textEl.classList.add('switching');
            setTimeout(function () {
              if (textEl) textEl.textContent = text;
              textEl && textEl.classList.remove('switching');
            }, 150);
          }
          if (done) {
            iconEl.classList.add('done');
          }
          currentStage++;
          stages.push({ iconEl: iconEl, done: !!done });
        };

        /** 应用加载完成：标记状态完成 → 文案切换 → 淡出遮罩层 → 移除 DOM */
        window.__appLoaded = function () {
          if (loaded) return;
          loaded = true;
          if (!iconEl) return;
          iconEl.classList.add('done');
          if (textEl) {
            textEl.classList.add('switching');
            setTimeout(function () {
              textEl.textContent = '加载完成，即将进入系统';
              textEl.classList.remove('switching');
            }, 150);
          }
          setTimeout(function () {
            var wrapper = document.getElementById('loader-wrapper');
            if (wrapper) {
              wrapper.classList.add('fade-out');
              wrapper.addEventListener('transitionend', function (e) {
                if (e.target === wrapper) wrapper.remove();
              });
              setTimeout(function () { wrapper.remove(); }, 5000);
            }
          }, 600);
        };
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
